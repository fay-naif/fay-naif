<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Fay Nayef — Software Developer, Data Analyst, Founder of Saudi Compass">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2E24"/>
      <stop offset="1" stop-color="#114D3B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A55C"/>
      <stop offset="1" stop-color="#E6CF9A"/>
    </linearGradient>
    <pattern id="stars" width="60" height="60" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#C9A55C" stroke-width="1">
        <rect x="18" y="18" width="24" height="24"/>
        <rect x="18" y="18" width="24" height="24" transform="rotate(45 30 30)"/>
      </g>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="300" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#stars)" opacity="0.16" mask="url(#m)"/>
    <circle cx="1040" cy="150" r="118" fill="none" stroke="#C9A55C" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="1040" cy="150" r="86" fill="none" stroke="#C9A55C" stroke-opacity="0.22" stroke-width="1"/>
    <g transform="translate(1040 150)" fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-opacity="0.9">
      <rect x="-42" y="-42" width="84" height="84"/>
      <rect x="-42" y="-42" width="84" height="84" transform="rotate(45)"/>
      <circle r="14"/>
    </g>
  </g>
  <rect x="80" y="104" width="4" height="96" rx="2" fill="url(#gold)"/>
  <text x="112" y="160" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="1" fill="#FFFFFF">Fay Nayef</text>
  <text x="114" y="198" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" letter-spacing="0.6" fill="#E6CF9A">Software Developer  ·  Data Analyst  ·  Founder of Saudi Compass</text>
</svg>
